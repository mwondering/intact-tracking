[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intact-tracking"
version = "0.1.0"
description = "Context-conditioned INTACT training and rollout collection for humanoid tracking."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "mjlab==1.5.0",
  "mujoco~=3.10.0",
  "numpy>=1.26,<2.5",
  "omegaconf>=2.3.0",
  "rsl-rl-lib==5.4.0",
  "tensordict>=0.8",
  "torch>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
intact-tracking-train = "intact_tracking.cli.train:main"
intact-tracking-collect = "intact_tracking.cli.collect:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"intact_tracking.environment.assets.robots.g1_tracking_bfm" = [
  "g1.xml",
  "assets/*.STL",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
